<script>
    function GetSystemId(outputId) {
        // alert("yes " + outputId);

        const id = Date.now();

        if (outputId === "1") {
            document.getElementById("wid1").value = id;
        }
        else if (outputId === "3") {
            document.getElementById("wid2").value = id;
        }
    }

    function showPage(pageId) {
        // alert("yes");
        const pages = ['list1', 'list2', 'list3'];
        document.querySelectorAll("form").forEach(form => {
            form.reset();
        });
        pages.forEach(id => {
            const section = document.getElementById(id);

            if (id === pageId) {
                section.style.display = 'block';
                const lastChar = pageId[pageId.length - 1];
                GetSystemId(lastChar);
            } else {
                section.style.display = 'none';
            }
        });

        // If we are hiding list2, also hide its dynamic data
        if (pageId !== 'list2') {
            document.getElementById('tripsdata').style.display = 'none';
            document.getElementById('amountdata').style.display = 'none';
            document.getElementById('driverbal').style.display = 'none';

            document.getElementById('screenshot').style.display = 'none';
            document.querySelectorAll('.image-container img').forEach(img => {
                img.style.display = 'none';
            });
        }
    }

    function captureDiv() {
        const element = document.getElementById("final bill");

        html2canvas(element, { scale: 2 }).then((canvas) => {
            const link = document.createElement("a");
            link.download = "screenshot.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }



</script>
