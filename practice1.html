<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Search Dropdown</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    padding: 40px;
    background: #f4f6f9;
}

.dropdown {
    width: 320px;
    position: relative;
}

.dropdown-input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    cursor: pointer;
}

.dropdown-list {
    position: absolute;
    width: 100%;
    border: 1px solid #ccc;
    background: white;
    max-height: 220px;
    overflow-y: auto;
    display: none;
    z-index: 1000;
}

.search-box {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

.search-box input {
    width: 100%;
    padding: 8px;
    font-size: 14px;
}

.dropdown-item {
    padding: 10px;
    cursor: pointer;
}

.dropdown-item:hover {
    background: #f0f0f0;
}

.dropdown-item.no-result {
    color: red;
    text-align: center;
    cursor: default;
    font-weight: bold;
}
</style>
</head>

<body>

<h3>Search Customer</h3>

<div class="dropdown">
    <input type="text" class="dropdown-input" placeholder="Select Customer" readonly>

    <div class="dropdown-list">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Type to search...">
        </div>

        <div id="items"></div>
    </div>
</div>

<script>
const names = [
    "Ramesh Kumar",
    "Suresh Reddy",
    "Anil Sharma",
    "Priya Verma",
    "Kiran Rao",
    "Lakshmi Devi",
    "Venkatesh Naidu",
    "Rahul Mehta",
    "Sneha Patel",
    "Arjun Singh",
    "Pooja Agarwal",
    "Naveen Chandra",
    "Bhavani Prasad",
    "Sathish Kumar",
    "Deepika Rao",
    "Manoj Gupta",
    "Swathi Reddy",
    "Harish Babu",
    "Akhil Varma",
    "Neha Jain"
];

const dropdownInput = document.querySelector(".dropdown-input");
const dropdownList = document.querySelector(".dropdown-list");
const itemsDiv = document.getElementById("items");
const searchInput = document.getElementById("searchInput");

// Render dropdown items
function renderItems(filter = "") {
    itemsDiv.innerHTML = "";

    const filteredNames = names.filter(name =>
        name.toLowerCase().includes(filter.toLowerCase())
    );

    // No result case
    if (filteredNames.length === 0) {
        const div = document.createElement("div");
        div.className = "dropdown-item no-result";
        div.textContent = "No user found";
        itemsDiv.appendChild(div);
        return;
    }

    filteredNames.forEach(name => {
        const div = document.createElement("div");
        div.className = "dropdown-item";
        div.textContent = name;

        div.onclick = () => {
            dropdownInput.value = name;
            dropdownList.style.display = "none";
        };

        itemsDiv.appendChild(div);
    });
}

// Open dropdown
dropdownInput.addEventListener("click", () => {
    dropdownList.style.display = "block";
    searchInput.value = "";
    renderItems();
    searchInput.focus();
});

// Search filtering
searchInput.addEventListener("input", (e) => {
    renderItems(e.target.value);
});

// Close dropdown when clicking outside
document.addEventListener("click", (e) => {
    if (!e.target.closest(".dropdown")) {
        dropdownList.style.display = "none";
    }
});
</script>

</body>
</html>
