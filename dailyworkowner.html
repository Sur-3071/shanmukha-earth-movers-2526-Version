<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Daily Work Data</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dailywork.css">
    <link rel="icon" type="image/x-icon"
        href="https://drive.google.com/file/d/1lahPE_k3iX1NqZT_F77wU_jm-X76yvAb/view?usp=sharing">

</head>
<style>
    /* ===== FORM CONTAINER ===== */

#formContainer1{
    width:50% !important;
    display:flex !important;
    justify-content:center !important;
    align-items:center !important;
    margin:40px auto !important;
}

/* ===== FORM BOX ===== */

#userForm{
    width:100% !important;
    max-width:850px !important;

    background:#ffffff !important;

    padding:25px !important;

    border-radius:18px !important;

    box-shadow:0 10px 35px rgba(0,0,0,0.12) !important;

    display:flex !important;
    flex-direction:column !important;

    gap:20px !important;
}

/* ===== DATE INPUTS ===== */

#userForm input[type="date"]{

    width:100% !important;

    padding:14px 18px !important;

    font-size:17px !important;

    border:2px solid #d8d8d8 !important;

    border-radius:12px !important;

    background:#fafafa !important;

    transition:.3s ease !important;

    box-sizing:border-box !important;
}

#userForm input[type="date"]:focus{

    outline:none !important;

    border-color:#007bff !important;

    background:#ffffff !important;

    box-shadow:0 0 12px rgba(0,123,255,.25) !important;
}

/* ===== BUTTON CONTAINER ===== */

#btn{

    display:flex !important;

    flex-direction:row !important;

    justify-content:center !important;

    align-items:center !important;

    gap:18px !important;

    width:100% !important;

    flex-wrap:nowrap !important;
}

/* ===== THREE BUTTONS ===== */

#submit1,
#submit2,
#submit3{

    flex:1 !important;

    min-width:180px !important;

    padding:14px 20px !important;

    border:none !important;

    border-radius:12px !important;

    color:#fff !important;

    font-size:16px !important;

    font-weight:700 !important;

    cursor:pointer !important;

    transition:.3s ease !important;

    box-shadow:0 6px 15px rgba(0,0,0,0.15) !important;
}

/* Submit */

#submit1{
    background:linear-gradient(135deg,#11998e,#38ef7d) !important;
}

/* Entire Data */

#submit2{
    background:linear-gradient(135deg,#0072ff,#00c6ff) !important;
}

/* Expenses */

#submit3{
    background:linear-gradient(135deg,#fc466b,#3f5efb) !important;
}

/* Hover */

#submit1:hover,
#submit2:hover,
#submit3:hover{

    transform:translateY(-3px) scale(1.03) !important;

    box-shadow:0 10px 25px rgba(0,0,0,0.22) !important;
}

/* Click */

#submit1:active,
#submit2:active,
#submit3:active{

    transform:scale(.96) !important;
}

/* ===== UPDATE BUTTON ===== */

#submit14{

    width:100% !important;

    padding:15px !important;

    border:none !important;

    border-radius:12px !important;

    background:linear-gradient(135deg,#ff512f,#dd2476) !important;

    color:#fff !important;

    font-size:18px !important;

    font-weight:800 !important;

    cursor:pointer !important;

    transition:.3s ease !important;

    box-shadow:0 8px 20px rgba(0,0,0,.18) !important;
}

#submit14:hover{

    transform:translateY(-2px) !important;

    box-shadow:0 12px 28px rgba(0,0,0,.25) !important;
}
#submit4{

    width:100% !important;

    padding:15px !important;

    border:none !important;

    border-radius:12px !important;

    background:linear-gradient(135deg,#ff512f,#dd2476) !important;

    color:#fff !important;

    font-size:18px !important;

    font-weight:800 !important;

    cursor:pointer !important;

    transition:.3s ease !important;

    box-shadow:0 8px 20px rgba(0,0,0,.18) !important;
}

#submit4:hover{

    transform:translateY(-2px) !important;

    box-shadow:0 12px 28px rgba(0,0,0,.25) !important;
}
.mainhaed1{

    text-align:center;

    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Helvetica,Arial,sans-serif;

    font-size:48px;

    font-weight:800;

    color:#24292f;

    letter-spacing:1px;

    margin:35px auto;

    position:relative;

    display:block;

    animation:fadeSlide 1s ease;
}

/* Animated underline */

.mainhaed1::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-12px;

    transform:translateX(-50%);

    width:120px;

    height:5px;

    border-radius:20px;

    background:linear-gradient(
        90deg,
        #2da44e,
        #0969da
    );

    animation:expandLine 2s ease infinite alternate;
}

/* Hover glow */

.mainhaed1:hover{

    color:#0969da;

    transition:.3s ease;

    text-shadow:0 0 12px rgba(9,105,218,.25);
}

/* Animations */

@keyframes fadeSlide{

    from{
        opacity:0;
        transform:translateY(-25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes expandLine{

    from{
        width:80px;
    }

    to{
        width:220px;
    }
}

/* ===== MOBILE ===== */

@media(max-width:768px){

    #btn{

        flex-wrap:wrap !important;

        gap:12px !important;
    }

    #submit1,
    #submit2,
    #submit3{

        width:100% !important;

        min-width:unset !important;
    }

    #userForm{

        padding:18px !important;
    }
}
</style>
<body style="background-color: antiquewhite; overflow-x:auto; max-width:100%;">
    <div id="home">
        <div id="com">
            <img src="company.png" style="padding-left: 20px;">
        </div>
        <h1 align="center" class="mainhaed1">Daily Work Data</h1>
    </div>
    <div id="formContainer1">
        <form id="userForm">
            <input type="date" id="dat1" name="dat1" placeholder="Date" required>
            <input type="date" id="dat2" name="dat2" placeholder="Date" required>
            <div id="btn">
                <input type="button" value="Submit" id="submit1">
                <input type="button" value="Entire Data" id="submit2">
                <input type="button" value="Expenses" id="submit3">
            </div>
        </form>

    </div>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <h1 style="
                color: red;
                font-size: 28px;
                font-family: 'Segoe UI', sans-serif;
                font-weight: bold;
                border-left: 6px solid crimson;
                padding: 8px 12px;
                background: #ffe6e6;
                margin: 15px 0;
                border-radius: 6px;
                box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
            ">
                Data Editing
            </h1>

            <span class="close">&times;</span>
            <div id="formContainer2">
                <form id="userForm">
                    <input type="date" id="dat" name="dat" placeholder="Date" required>
                    <input type="text" id="name" name="name" placeholder="Customer Name" required>
                    <input type="text" id="vil" name="vil" placeholder="Village" required>
                    <input type="tel" id="dis" name="dis" placeholder="Enter Disel Amount" required>
                    <input type="text" id="wid" name="wid" placeholder="Work Id" readonly required>
                    <input type="text" id="pay" name="payid" placeholder="Payment Status" readonly required>

                    <select id="worktype" required onchange="addflow()">
                        <option hidden>select Work Type</option>
                        <option>Hours</option>
                        <option>Loading</option>
                        <option>Contract</option>
                    </select>
                    <input type="text" id="beta" name="beta" placeholder="Driver Beta" onchange="timecal()">
                    <div id="hours" style="display: none;">
                        <input type="text" id="hrsrate" name="hrsrate" placeholder="Hours Price" onkeyup="timecal()"
                            required>
                        <div id="loading1">
                            <input type="text" id="trprate1" name="trprate1" placeholder="Trip Price"
                                onkeyup="tripprice1()" required>
                            <div id="container2">
                                <div class="row1">
                                    <button type="button" class="add-button" onclick="addRow1()">Add Driver</button>
                                </div>
                            </div>
                            <textarea id="output1" placeholder="All Drivers list" rows="4" cols="30"
                                style="font-size: 20px;" readonly></textarea>
                            <input type="text" id="trips1" placeholder="Number of Trips" readonly required>
                            <input type="text" id="hoursnoncompanytractors" placeholder="Number of Non Company Tractor Trips" readonly required>
                            <input type="text" id="alltrprate" name="alltrprate" placeholder="Total Trip Price" required
                        value="0">
                        </div>
                        <input type="text" id="desc" name="desc" placeholder="Description" required>
                        <input type="time" id="stime" name="stime" placeholder="Starting Time" onchange="timecal()"
                            required>
                        <input type="time" id="etime" name="etime" placeholder="Ending Time" onchange="timecal()"
                            required>
                        <input type="text" id="ttime" name="ttime" placeholder="Total Time" readonly required>
                    </div>
                    <div id="loading" style="display: none;">
                        <input type="text" id="jcbtrprate" name="jcbtrprate" placeholder="JCB Trip Price"
                            onkeyup="tripprice()" required>
                        <input type="text" id="trprate" name="trprate" placeholder="Trip Price" required>
                        <div id="container43">
                            <div class="row">
                                <button type="button" type="button" class="add-button" onclick="addRow()">Add</button>
                            </div>
                        </div>
                        <textarea id="output" placeholder="All Drivers list" rows="4" cols="30"
                            style="font-size: 20px; " onkeyup="tripedit()"> </textarea>
                        <input type=" text" id="trips" name="trips" placeholder="Number of Trips" onkeyup="tripprice()">
                        <input type="text" id="noncompanytractors" placeholder="Number of Non Company Tractor Trips" readonly required>
                    </div>
                    <div id="contract" style="display: none;">
                        <input type="text" id="con" name="con" placeholder="Contract Amount" onkeyup="conprice()"
                            required>
                    </div>
                    <input type="text" id="rate" name="rate" placeholder="Price" required>
                    <input type="button" value="Update Data" id="submit4">
                </form>
            </div>
            <div style="display:flex; justify-content:center; align-items:center; height:100%;">
                <img src="done1.png" id="done" style="display:none;" height="100px" width="100px">
            </div>
        </div>
    </div>
    <div>
        <input type="text" placeholder="Search Box" id="search">
    </div>

    <div class="select-wrapper" style="margin-left: 50px; margin-top: 100px;">
        <select id="typech" name="purpose" required class="select" style="display: none;">
            <option value="" selected disabled>Select Purpose Type</option>
            <option value="Farming">Farming</option>
            <option value="Jcb">JCB</option>
            <option value="Home">Home</option>
            <option value="Salary">Salary</option>
            <option value="Salary Expenses">Salary Expenses</option>
            <option>Dady</option>
            <option>Suresh</ption>
        </select>
    </div>
    <img src="done1.png" id="done" style="display: none;" height="100px" width="100px">
    <div id="enterdata" class="scroll-container">

    </div>
    <div id="homeexp" style="padding-top: 80px;">
    </div>
    <div id="ledger">
    </div>
    <marquee behavior="scroll" direction="left" scrollamount="10">
        <img src="jcb.png" height="500px" width="500px" id="jcb">
    </marquee>
    <script>
        function tripedit() {
            var d = document.getElementById("output").value;
            var d1 = d.split("\n");
            var s = 0;
            for (var i = 0; i < d1.length; i++) {
                var p = d1[i].split(" ");
                if (!isNaN(p[2])) {
                    // console.log(p[2], i);
                    s += parseInt(p[2]);
                }
                document.getElementById("trips").value = s;
                document.getElementById("rate").value = s * 150;
            }

        }
    </script>
    <!-- Load the main script as a module -->
    <script type="module" src="editpopup.js"></script>
    <script src="dailywork.js"></script>
    <script type="module" src="dailyworkretrive.js"></script>
    <script type="module" src="dailywork.js"></script>

</body>

</html>
