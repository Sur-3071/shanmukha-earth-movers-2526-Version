<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suresh.Tech Note Pad Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --navy-dark: #122238;
    --navy-mid: #1a3352;
    --blue-accent: #1769e0;
    --blue-hover: #1254b7;
    --ink: #1760c5;
    --paper-bg: #fffefa;
    --paper-line: #cbe0f5;
    --margin-red: #f2a4ad;
    --panel-border: #d4e3f5;
    --topbar-height: 54px;
    --bottombar-height: 74px;
}

* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #e2ecf8;
    color: var(--navy-dark);
}

/* ---------------- TOPBAR ---------------- */
.topbar {
    height: var(--topbar-height);
    background: linear-gradient(135deg, var(--navy-dark), var(--navy-mid));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    gap: 10px;
    box-shadow: 0 2px 10px rgba(10, 25, 45, 0.25);
    z-index: 30;
    position: relative;
}

.brand {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}
.brand-icon { font-size: 20px; }
.brand-title {
    font-family: 'Kalam', cursive;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.top-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 2px 0;
}
.top-controls::-webkit-scrollbar { display: none; }

.control-item {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.08);
    padding: 3px 8px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    white-space: nowrap;
}
.control-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #bcd5f5;
    font-weight: 600;
}

select.top-select {
    background: #ffffff;
    color: var(--navy-dark);
    border: none;
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 11px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
}

.color-dots {
    display: flex;
    align-items: center;
    gap: 5px;
}
.color-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
    padding: 0;
}
.color-dot:hover { transform: scale(1.15); }
.color-dot.active {
    border-color: #ffffff;
    box-shadow: 0 0 0 2px var(--blue-accent);
}

.speed-range {
    width: 60px;
    accent-color: var(--blue-accent);
    cursor: pointer;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
}
.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
.btn-primary {
    background: var(--blue-accent);
    color: #fff;
    box-shadow: 0 2px 6px rgba(23, 105, 224, 0.4);
}
.btn-primary:hover:not(:disabled) {
    background: var(--blue-hover);
    transform: translateY(-1px);
}
.btn-danger {
    background: #394b61;
    color: #f1f5f9;
    border: 1px solid #4f647d;
}
.btn-danger:hover:not(:disabled) {
    background: #e11d48;
    color: #fff;
    border-color: #e11d48;
}
.btn-secondary {
    background: #ffffff;
    color: var(--navy-mid);
}
.btn-secondary:hover:not(:disabled) {
    background: #f0f5fc;
}

/* ---------------- MAIN VIEWPORT & NOTEBOOK PAGES ---------------- */
.main-stage {
    height: calc(100vh - var(--topbar-height) - var(--bottombar-height));
    width: 100%;
    padding: 10px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
}

.notebook-container {
    display: flex;
    gap: 12px;
    height: 100%;
    width: 100%;
    max-width: 1600px;
    justify-content: center;
    align-items: stretch;
    position: relative;
}

.notebook-page {
    flex: 1;
    min-width: 0;
    height: 100%;
    background-color: var(--paper-bg);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(18, 34, 56, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    --line-height: 28px;
    background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--line-height) - 1px),
        var(--paper-line) var(--line-height)
    );
}

/* Notebook Page Margins */
.notebook-page::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 36px;
    width: 2px;
    background: var(--margin-red);
    z-index: 2;
    pointer-events: none;
}

.page-header-decor {
    position: absolute;
    top: 6px;
    right: 18px;
    font-family: 'Caveat', cursive;
    font-size: 13px;
    color: #94a3b8;
    z-index: 2;
    pointer-events: none;
    user-select: none;
}

.page-content {
    position: relative;
    z-index: 1;
    padding: 28px 28px 12px 48px; /* Refined top and right padding for natural alignment */
    height: 100%;
    width: 100%;
    overflow: hidden;
    box-sizing: border-box;
}

.written-line {
    margin: 0;
    padding: 0;
    color: var(--ink);
    font-family: 'Kalam', cursive;
    font-size: 22px;
    line-height: 28px;
    height: 28px;
    white-space: pre;
    overflow: hidden;
    word-break: break-all;
}

/* Writing Pen Cursor Indicator */
.pen-hand {
    position: absolute;
    z-index: 10;
    display: none;
    pointer-events: none;
    font-size: 22px;
    transform: translate(-4px, -10px) rotate(-10deg);
    transition: left 0.03s linear, top 0.03s linear;
    filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.18));
}

/* ---------------- BOTTOM PANEL ---------------- */
.bottom-panel {
    height: var(--bottombar-height);
    background: #ffffff;
    border-top: 1px solid var(--panel-border);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 -4px 15px rgba(18, 34, 56, 0.05);
    position: relative;
    z-index: 20;
}

.input-container {
    flex: 1;
    height: 100%;
    position: relative;
}

#sentence {
    width: 100%;
    height: 100%;
    resize: none;
    border: 1px solid #cce0f5;
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--navy-dark);
    outline: none;
    background: #f8fbff;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
    transition: border-color 0.15s ease, background 0.15s ease;
}
#sentence:focus {
    border-color: var(--blue-accent);
    background: #ffffff;
}

.status-badge {
    font-size: 11px;
    color: #536b88;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
    background: #edf4fc;
    white-space: nowrap;
    flex-shrink: 0;
}

/* ---------------- PRINT RULES ---------------- */
@media print {
    @page {
        size: A4 landscape;
        margin: 8mm;
    }
    body {
        background: #ffffff !important;
        overflow: visible !important;
    }
    .topbar, .bottom-panel, .pen-hand, .status-badge {
        display: none !important;
    }
    .main-stage {
        height: auto !important;
        padding: 0 !important;
    }
    .notebook-container {
        gap: 10px !important;
    }
    .notebook-page {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
        break-inside: avoid;
    }
}

@media (max-width: 800px) {
    .control-label { display: none; }
    .brand-title { font-size: 16px; }
    .btn span { display: none; }
    .btn { padding: 0 8px; }
}
</style>
</head>
<body>

<!-- TOPBAR / CONTROL TOOLBAR -->
<header class="topbar">
    <div class="brand">
        <span class="brand-icon" aria-hidden="true">📝</span>
        <span class="brand-title">Suresh.Tech</span>
    </div>

    <div class="top-controls">
        <!-- Style -->
        <div class="control-item">
            <span class="control-label">Style</span>
            <select id="fontStyle" class="top-select">
                <option value="'Kalam', cursive">Neat (Rounded)</option>
                <option value="'Caveat', cursive">Natural</option>
                <option value="'Patrick Hand', cursive">Simple &amp; Clean</option>
            </select>
        </div>

        <!-- Base Size -->
        <div class="control-item">
            <span class="control-label">Base Size</span>
            <select id="writingSize" class="top-select">
                <option value="22" selected>Medium (22px)</option>
                <option value="26">Large (26px)</option>
                <option value="18">Small (18px)</option>
            </select>
        </div>

        <!-- Ink Color -->
        <div class="control-item">
            <span class="control-label">Ink</span>
            <div class="color-dots" id="colorPalette">
                <button class="color-dot active" style="background:#1760c5" data-color="#1760c5" title="Blue"></button>
                <button class="color-dot" style="background:#111111" data-color="#111111" title="Black"></button>
                <button class="color-dot" style="background:#ef3038" data-color="#ef3038" title="Red"></button>
                <button class="color-dot" style="background:#168744" data-color="#168744" title="Green"></button>
                <button class="color-dot" style="background:#8024c7" data-color="#8024c7" title="Purple"></button>
            </div>
        </div>

        <!-- Speed -->
        <div class="control-item">
            <span class="control-label">Speed</span>
            <input type="range" id="speed" class="speed-range" min="5" max="80" value="25" title="Writing Speed">
        </div>
    </div>

    <!-- Actions -->
    <div class="top-actions">
        <button class="btn btn-primary" id="writeBtn" type="button">✍️ <span>Write</span></button>
        <button class="btn btn-danger" id="clearBtn" type="button">🗑️ <span>Clear</span></button>
        <button class="btn btn-secondary" id="printBtn" type="button">🖨️ <span>PDF / Print</span></button>
    </div>
</header>

<!-- MAIN NOTEBOOK STAGE -->
<main class="main-stage" id="mainStage">
    <div class="notebook-container" id="notebookContainer">
        <!-- Notebook pages are auto-generated dynamically here -->
    </div>
    <div class="pen-hand" id="penHand" aria-hidden="true">✍️</div>
</main>

<!-- BOTTOM TEXTAREA PANEL -->
<footer class="bottom-panel">
    <div class="input-container">
        <textarea id="sentence" placeholder="Type or paste text here... (Press Ctrl + Enter to write)"></textarea>
    </div>
    <div class="status-badge" id="statusBadge">Screen Fit: Ready</div>
</footer>

<script>
// State & DOM Elements
const fontStyleSelect = document.getElementById('fontStyle');
const writingSizeSelect = document.getElementById('writingSize');
const speedInput = document.getElementById('speed');
const writeBtn = document.getElementById('writeBtn');
const clearBtn = document.getElementById('clearBtn');
const printBtn = document.getElementById('printBtn');
const sentenceInput = document.getElementById('sentence');
const statusBadge = document.getElementById('statusBadge');
const notebookContainer = document.getElementById('notebookContainer');
const penHand = document.getElementById('penHand');
const mainStage = document.getElementById('mainStage');

let currentInkColor = '#1760c5';
let isWriting = false;
let cancelWriting = false;

// Color Palette Selector
document.querySelectorAll('#colorPalette .color-dot').forEach(dot => {
    dot.addEventListener('click', () => {
        document.querySelectorAll('#colorPalette .color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentInkColor = dot.dataset.color;
        applyStyleUpdates();
    });
});

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// Calculate max lines per column with tighter, natural 28px line height
function calculateMaxLinesPerColumn() {
    const stageHeight = mainStage.clientHeight - 20;
    const lineHeight = 28; 
    const headerOffset = 40; 
    return Math.max(2, Math.floor((stageHeight - headerOffset) / lineHeight));
}

// Helper to create page/column element
function createPageElement(colIndex, totalCols) {
    const page = document.createElement('div');
    page.className = 'notebook-page';
    
    const headerDecor = document.createElement('div');
    headerDecor.className = 'page-header-decor';
    headerDecor.textContent = `Part ${colIndex + 1} of ${totalCols}`;
    
    const content = document.createElement('div');
    content.className = 'page-content';
    content.id = `pageContent_${colIndex}`;

    page.appendChild(headerDecor);
    page.appendChild(content);
    return page;
}

function setupPages(numPages) {
    notebookContainer.innerHTML = '';
    for (let i = 0; i < numPages; i++) {
        const pageEl = createPageElement(i, numPages);
        notebookContainer.appendChild(pageEl);
    }
}

function applyStyleUpdates() {
    document.querySelectorAll('.written-line').forEach(line => {
        line.style.fontFamily = fontStyleSelect.value;
        line.style.color = currentInkColor;
    });
}

// Move Pen Emoji to current typing position
function movePenToChar(lineElement, charIdx) {
    if (!lineElement) return;
    const range = document.createRange();
    const textNode = lineElement.firstChild;
    if (!textNode || textNode.textContent.length === 0) {
        const rect = lineElement.getBoundingClientRect();
        const stageRect = mainStage.getBoundingClientRect();
        penHand.style.left = (rect.left - stageRect.left + 44) + 'px';
        penHand.style.top = (rect.top - stageRect.top) + 'px';
        penHand.style.display = 'block';
        return;
    }
    
    const safeIdx = Math.min(charIdx, textNode.textContent.length);
    try {
        range.setStart(textNode, safeIdx);
        range.setEnd(textNode, safeIdx);
        const rect = range.getBoundingClientRect();
        const stageRect = mainStage.getBoundingClientRect();
        penHand.style.left = (rect.left - stageRect.left + 6) + 'px';
        penHand.style.top = (rect.top - stageRect.top - 4) + 'px';
        penHand.style.display = 'block';
    } catch (e) {
        // Fallback positioning
    }
}

// Wrap text into lines based on column width and font size
function wrapTextToLines(text, columnWidthPx, fontSizePx) {
    const charWidthEst = fontSizePx * 0.50; 
    const maxCharsPerLine = Math.max(8, Math.floor((columnWidthPx - 76) / charWidthEst));
    const rawLines = text.split('\n');
    const processedLines = [];

    rawLines.forEach(rawLine => {
        if (rawLine === '') {
            processedLines.push('');
            return;
        }
        let current = rawLine;
        while (current.length > maxCharsPerLine) {
            let breakIdx = current.lastIndexOf(' ', maxCharsPerLine);
            if (breakIdx <= 0) breakIdx = maxCharsPerLine;
            processedLines.push(current.substring(0, breakIdx));
            current = current.substring(breakIdx).trimStart();
        }
        if (current.length > 0) {
            processedLines.push(current);
        }
    });

    return processedLines;
}

// SCREEN-FIT CALCULATOR: Determines needed columns (1, 2, or 3) & font scaling
function computeLayoutPlan(text, baseFontSize) {
    const stageWidth = mainStage.clientWidth;
    const maxLinesPerCol = calculateMaxLinesPerColumn();
    
    const fontSizesToTry = [baseFontSize, 20, 18, 16, 14, 12];

    for (let fontSize of fontSizesToTry) {
        // Try 1 Column
        let colWidth = stageWidth;
        let lines = wrapTextToLines(text, colWidth, fontSize);
        if (lines.length <= maxLinesPerCol) {
            return { columns: 1, fontSize: fontSize, lines: lines };
        }

        // Try 2 Columns
        colWidth = (stageWidth / 2) - 12;
        lines = wrapTextToLines(text, colWidth, fontSize);
        if (lines.length <= maxLinesPerCol * 2) {
            return { columns: 2, fontSize: fontSize, lines: lines };
        }

        // Try 3 Columns
        colWidth = (stageWidth / 3) - 16;
        lines = wrapTextToLines(text, colWidth, fontSize);
        if (lines.length <= maxLinesPerCol * 3) {
            return { columns: 3, fontSize: fontSize, lines: lines };
        }
    }

    // Fallback for massive text content: 3 columns with 12px min size
    const minFont = 12;
    const colWidth = (stageWidth / 3) - 16;
    const lines = wrapTextToLines(text, colWidth, minFont);
    return { columns: 3, fontSize: minFont, lines: lines };
}

// Core Animated Writing Engine
async function startWritingProcess() {
    const rawText = sentenceInput.value.trim();
    if (!rawText) {
        statusBadge.textContent = 'Please enter text first.';
        return;
    }

    if (isWriting) return;
    isWriting = true;
    cancelWriting = false;
    writeBtn.disabled = true;

    const baseFontSize = parseInt(writingSizeSelect.value, 10);
    const layout = computeLayoutPlan(rawText, baseFontSize);

    setupPages(layout.columns);
    statusBadge.textContent = `Fit: ${layout.columns} ${layout.columns === 1 ? 'Page' : 'Parts'} (${layout.fontSize}px)`;

    const maxLinesPerCol = calculateMaxLinesPerColumn();
    const allLines = layout.lines;
    let currentLineIdx = 0;

    for (let colIdx = 0; colIdx < layout.columns; colIdx++) {
        if (cancelWriting) break;

        const pageContentContainer = document.getElementById(`pageContent_${colIdx}`);
        let linesInThisCol = 0;

        while (currentLineIdx < allLines.length && linesInThisCol < maxLinesPerCol) {
            if (cancelWriting) break;

            const lineText = allLines[currentLineIdx];
            const lineEl = document.createElement('p');
            lineEl.className = 'written-line';
            lineEl.style.fontFamily = fontStyleSelect.value;
            lineEl.style.fontSize = layout.fontSize + 'px';
            lineEl.style.color = currentInkColor;

            const textNode = document.createTextNode('');
            lineEl.appendChild(textNode);
            pageContentContainer.appendChild(lineEl);

            if (lineText.length === 0) {
                lineEl.innerHTML = '&nbsp;';
                await wait(parseInt(speedInput.value, 10));
            } else {
                for (let c = 0; c < lineText.length; c++) {
                    if (cancelWriting) break;
                    textNode.textContent += lineText[c];
                    movePenToChar(lineEl, c + 1);
                    await wait(parseInt(speedInput.value, 10));
                }
            }

            linesInThisCol++;
            currentLineIdx++;
        }
    }

    penHand.style.display = 'none';
    isWriting = false;
    writeBtn.disabled = false;
    if (!cancelWriting) {
        statusBadge.textContent = `Complete (${layout.columns} Parts, ${layout.fontSize}px)`;
        sentenceInput.value = '';
    } else {
        statusBadge.textContent = 'Stopped';
    }
}

// Event Listeners
writeBtn.addEventListener('click', startWritingProcess);

clearBtn.addEventListener('click', () => {
    cancelWriting = true;
    isWriting = false;
    writeBtn.disabled = false;
    penHand.style.display = 'none';
    setupPages(1);
    statusBadge.textContent = 'Screen Fit: Ready';
});

printBtn.addEventListener('click', () => {
    window.print();
});

fontStyleSelect.addEventListener('change', applyStyleUpdates);
writingSizeSelect.addEventListener('change', () => {
    if (!isWriting && sentenceInput.value.trim().length > 0) {
        startWritingProcess();
    }
});

sentenceInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        startWritingProcess();
    }
});

window.addEventListener('resize', () => {
    if (!isWriting && notebookContainer.children.length === 0) {
        setupPages(1);
    }
});

// Initialize
setupPages(1);
</script>
</body>
</html>
