<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Salary & Leave Dashboard</title>
    <style>
       /* ===== Base ===== */
body {
    font-family: 'Poppins', sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 20px;
    text-align: center;
}

h1, h2 {
    color: #333;
    margin-top: 20px;
}

/* ===== Toggle Button ===== */
#toggleBtn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    margin-bottom: 20px;
    transition: background 0.3s;
}
#toggleBtn:hover {
    background-color: #0056b3;
}

/* ===== Select Dropdown ===== */
select {
    padding: 10px 15px;
    font-size: 16px;
    border: 2px solid #007bff;
    border-radius: 8px;
    outline: none;
    cursor: pointer;
    transition: 0.3s ease;
    width: 400px;
    background-color: #fff;
}
select:focus {
    border-color: #0056b3;
    box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
}

label {
    font-size: 18px;
    margin-bottom: 10px;
    display: block;
    font-weight: bold;
}

/* ===== Month Grid ===== */
.month-grid {
    display: none;
    overflow-x: auto;
    gap: 20px;
    padding: 20px;
    margin: 0 auto;
    max-width: 95%;
    scroll-behavior: smooth;
    scrollbar-width: none;
}
.month-grid::-webkit-scrollbar {
    display: none;
}

.month-card {
    flex: 0 0 220px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    padding: 15px;
    transition: 0.3s;
}
.month-card:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.month-header {
    background: #007bff;
    color: white;
    font-weight: bold;
    font-size: 18px;
    padding: 8px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.month-details p {
    margin: 6px 0;
    font-size: 14px;
}

/* ===== Forms ===== */
.forms-section {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 30px;
    margin: 40px 0;
}

.form-container {
    background: #fff;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    width: 420px;
}

.form-container input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.form-container input[type="button"] {
    background: linear-gradient(45deg, #27ae60, #2ecc71);
    color: white;
    border: none;
    cursor: pointer;
}
.form-container input[type="button"]:hover {
    background: linear-gradient(45deg, #2ecc71, #27ae60);
}

/* ===== Table Box ===== */
.table-box {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: 0.3s;
}
.table-box:hover {
    transform: scale(1.02);
}

/* ===== Salary Table ===== */
.salary-table table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
.salary-table caption {
    background: linear-gradient(45deg, #007bff, #00c6ff);
    color: white;
    padding: 12px;
    font-weight: bold;
    font-size: 18px;
}
.salary-table th {
    background: #007bff;
    color: white;
    padding: 14px 20px;
    border: 1px solid #ddd;
}
.salary-table td {
    padding: 14px 20px;
    border: 1px solid #ddd;
}
.salary-table tr:nth-child(even) {
    background-color: #f9f9f9;
}
.salary-table tr:hover {
    background-color: #eef6ff;
}
.salary-table td:last-child {
    font-weight: bold;
    color: #28a745;
}

/* ===== Leave Table ===== */
.leave-table table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
.leave-table caption {
    background: linear-gradient(45deg, #27ae60, #2ecc71);
    color: white;
    padding: 12px;
    font-weight: bold;
    font-size: 18px;
}
.leave-table th {
    background: #27ae60;
    color: white;
    padding: 14px 20px;
    border: 1px solid #ddd;
}
.leave-table td {
    padding: 14px 20px;
    border: 1px solid #ddd;
}
.leave-table tr:nth-child(even) {
    background-color: #f4fbf6;
}
.leave-table tr:hover {
    background-color: #e8f8ee;
}
.leave-table td:last-child {
    font-weight: bold;
    color: #e67e22;
}

/* ===== General Table Fix ===== */
th, td {
    padding: 14px 20px;
    border: 1px solid #ccc;
}

/* ===== Banner ===== */
.salary-banner {
    margin-top: 30px;
    padding: 15px;
    font-weight: bold;
    font-size: 18px;
    border-radius: 12px;
    color: white;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* ===== Image ===== */
.driver-image img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid green;
}

/* ===== Modal ===== */
.image-modal {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
}
.modal-content {
    max-width: 80%;
    max-height: 80%;
}
.close-btn {
    position: absolute;
    top: 20px;
    right: 40px;
    font-size: 30px;
    color: white;
    cursor: pointer;
}

/* ===== Image Modal ===== */
.image-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background-color: rgba(0, 0, 0, 0.9);

    /* Center the image */
    justify-content: center;
    align-items: center;
}

/* Image inside modal */
.modal-content {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
    object-fit: contain;
}

/* Close button */
.close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 35px;
    color: white;
    cursor: pointer;
    z-index: 1001;
}

/* Container */
.driver-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

/* Salary banner (text part) */
.salary-banner {
    flex: 1; /* take remaining space */
    padding: 15px;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    font-size: 18px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* Driver image */
.driver-image {
    flex: 0 0 120px; /* fixed size */
    display: flex;
    justify-content: center;
}

.driver-image img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #27ae60;
}

/* Optional hover zoom */
.modal-content:hover {
    transform: scale(1.05);
    transition: 0.3s ease;
}

/* ===== Responsive ===== */
@media screen and (max-width: 900px) {
    .forms-section {
        flex-direction: column;
        align-items: center;
    }

    select {
        width: 100%;
    }
}
    </style>
</head>

<body style="background-color: antiquewhite;">

    <div id="com">
        <img src="company.png" style="padding-left: 20px;">
    </div>


    <div class="driver-container">

        <div class="salary-banner">
            🚗 డ్రైవర్ పేరు: కొండపల్లి దుర్గ ప్రసాద్ |
            💼 ముందస్తు మొత్తం: ₹30,000 |
            💰 నెలవారీ జీతం: ₹15,000 |
            🧾 రోజువారీ భత్యం: ₹200 |
            📅 నెలవారీ సెలవులు: 2 రోజులు
        </div>

        <div class="driver-image">
            <img src="JCBDriverImage.png" alt="Driver" onclick="openImage(this)">
        </div>
        <div id="imageModal" class="image-modal">
            <span class="close-btn" onclick="closeImage()">❌</span>
            <img id="modalImg" class="modal-content">
        </div>

    </div>

    <img src="done1.png" id="done" style="display: none; margin: 0 auto;" height="100px" width="100px">

    <div class="forms-section">
        <div class="form-container">
            <h2>Driver Salary Entry</h2>
            <form id="userForm2">
                <input type="date" id='d2' placeholder="Enter Date" onchange="GetSystemId('wid2')">
                <select id="monthDropdown1">
                    <option value="" disabled selected>Select Month</option>
                </select>
                <input type="text" id='wid2' placeholder="System Id" readonly>
                <select id="paymentMethod">
                    <option value="" disabled selected>Select Payment Method</option>
                    <option value="cash">💵 Cash</option>
                    <option value="Phonepe">📱 PhonePe</option>
                    <option value="Paytm">💳 Paytm</option>
                    <option value="Gpay">💰 Google Pay</option>
                    <option value="Bank Transfer">🏦 Bank Transfer</option>
                </select>
                <input type="text" id="reason"  placeholder="Enter Purpose">
                <input type="text" id="work2" maxlength="6" placeholder="Enter Salary">
                <input type="button" value="Submit Salary" id="submit2">
            </form>
        </div>

        <div class="form-container">
            <h2>Driver Leave Entry</h2>
            <form id="userForm1">
                <input type="date" id='d1' placeholder="Enter Date" onchange="GetSystemId('wid1')">
                <select id="monthDropdown">
                    <option value="" disabled selected>Select Month</option>
                </select>
                <input type="text" id='wid1' placeholder="System Id" readonly>
                <input type="text" id="work1" placeholder="Enter Reason">
                <input type="button" value="Submit Leave" id="submit1">
            </form>
        </div>
    </div>

    <button id="toggleBtn">Show Monthly Data</button>

    <div class="month-grid" id="monthGrid">

    </div>

    <div id="tablesContainer" style="display:flex; justify-content:center; gap:40px; flex-wrap:wrap;">
        <div id="salaryTableContainer"></div>
        <div id="leaveTableContainer"></div>
    </div>

    <marquee behavior="scroll" direction="left" scrollamount="10">
        <img src="jcb.png" height="500px" width="500px" id="jcb">
    </marquee>

</body>
</div>
<script>

    function openImage(img) {
        document.getElementById("imageModal").style.display = "block";
        document.getElementById("modalImg").src = img.src;
    }

    function closeImage() {
        document.getElementById("imageModal").style.display = "none";
    }

    const months = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    const dropdown = document.getElementById("monthDropdown");
    const dropdown1 = document.getElementById("monthDropdown1");

    months.forEach(month => {
        const option = document.createElement("option");
        option.text = month;
        option.value = month;
        dropdown.add(option);

    });
    months.forEach(month => {
        const option = document.createElement("option");
        option.text = month;
        option.value = month;
        dropdown1.add(option);

    });

    const grid = document.getElementById("monthGrid");
    const toggleBtn = document.getElementById("toggleBtn");
    const table = document.getElementById("tablesContainer");

    const generateCards = () => {
        grid.innerHTML = months.map(m => `
    <div class="month-card" id="card-${m}">
      <div class="month-header">${m}</div>
      <div class="month-details">
        <p>💰 Salary Taken: <span class="salary">₹0</span></p>
        <p>📅 Leaves Taken: <span class="leaves">0</span> Days</p>
        <p>⏳ Remaining Leaves: <span class="remaining-leaves">0</span> Days</p>
        <p>🗓️ Extra Leaves: <span class="extra-leaves">0</span> Days</p>
        <p>🔻 Salary Cuttings: <span class="cut-salary">₹0</span></p>
        <p>💵 Remaining Salary: <span class="remaining-salary">₹15000</span></p>

      </div>
    </div>
  `).join('');
    };


    // ✅ Toggle show/hide logic
    toggleBtn.addEventListener("click", () => {
        if (grid.style.display === "none" || grid.style.display === "") {
            generateCards();
            grid.style.display = "flex";
            table.style.display = "flex";
            toggleBtn.textContent = "Hide Monthly Data";
        } else {
            grid.style.display = "none";
            table.style.display = "none";
            toggleBtn.textContent = "Show Monthly Data";
        }
    });

    // ✅ Drag-to-scroll logic
    let isDown = false;
    let startX;
    let scrollLeft;

    grid.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - grid.offsetLeft;
        scrollLeft = grid.scrollLeft;
        grid.style.cursor = 'grabbing';
    });

    grid.addEventListener('mouseleave', () => {
        isDown = false;
        grid.style.cursor = 'grab';
    });

    grid.addEventListener('mouseup', () => {
        isDown = false;
        grid.style.cursor = 'grab';
    });

    grid.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - grid.offsetLeft;
        const walk = (x - startX) * 1.5; // scroll speed
        grid.scrollLeft = scrollLeft - walk;
    });

    // ✅ Touch support (for mobile)
    let touchStartX = 0;
    grid.addEventListener("touchstart", e => {
        touchStartX = e.touches[0].clientX;
        scrollLeft = grid.scrollLeft;
    });
    grid.addEventListener("touchmove", e => {
        const touchX = e.touches[0].clientX;
        const move = (touchX - touchStartX) * 1.5;
        grid.scrollLeft = scrollLeft - move;
    });
</script>
<script type="module" src="jcbdriverdatabase.js"></script>
<script src="jcbdriverstatus.js"></script>


</html>
