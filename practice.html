<!DOCTYPE html>
<html>
<head>
  <title>Monthly Income Chart with Oil Info</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<canvas id="myChart" width="800" height="400"></canvas>

<script>
  const labels = ['January', 'February', 'March', 'April', 'May', 'June',
                  'July', 'August', 'September', 'October', 'November', 'December'];

  // All arrays start from index 1, so index 0 is placeholder
  var months    = [0, 100000, 120000, 150000, 180000, 200000, 220000, 250000, 270000, 290000, 310000, 330000, 350000];
  var profit    = [0, 20000, -25000, 30000, 32000, 40000, 41000, 44000, 47000, 49000, 52000, 54000, 60000];
  var worked    = [0, 26, 24, 27, 28, 26, 25, 27, 29, 26, 28, 27, 30];
  var totalDays = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var holidays  = [0, 6, 4, 2, 2, 2, 5, 7, 9, 6, 8, 2, 3];
  var oil       = [0, 12, 10, 14, 13, 15, 11, 10, 16, 18, 12, 14, 15]; // oil usage per month

  const income = months.slice(1);

  const customData = profit.slice(1).map((p, i) => ({
    profit: p,
    worked: worked[i + 1],
    totalDays: totalDays[i + 1],
    holidays: holidays[i + 1],
    oil: oil[i + 1]
  }));

  const ctx = document.getElementById('myChart').getContext('2d');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Income',
        data: income,
        backgroundColor: profit.slice(1).map(p => p >= 0 ? 'rgba(0, 200, 100, 0.7)' : 'rgba(255, 50, 50, 0.7)'),
        custom: customData
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
          min: 0,
          max: 350000,
          ticks: {
            stepSize: 25000
          }
        }
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: function(context) {
              const index = context.dataIndex;
              const dataset = context.dataset;
              const income = dataset.data[index];
              const custom = dataset.custom[index];
              const profitVal = custom.profit;
              const profitLabel = profitVal >= 0
                ? `Profit: ₹${profitVal.toLocaleString()}`
                : `Loss: ₹${Math.abs(profitVal).toLocaleString()}`;

              return [
                `Income: ₹${income.toLocaleString()}`,
                profitLabel,
                `Total Days: ${custom.totalDays}`,
                `Days Worked: ${custom.worked}`,
                `Holidays: ${custom.holidays}`,
                `Oil Used: ${custom.oil} L`
              ];
            },
            labelTextColor: function(context) {
              const profit = context.dataset.custom[context.dataIndex].profit;
              return profit >= 0 ? 'green' : 'red';
            }
          }
        }
      }
    }
  });
</script>

</body>
</html>
